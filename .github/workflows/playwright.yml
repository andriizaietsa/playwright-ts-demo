name: Playwright tests

# Manual only: start it from Actions → Playwright tests → Run workflow.
on:
  workflow_dispatch:

concurrency: # starting a new run cancels the one still running on the same branch
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          # Optional repo secrets; when unset, config/env.ts falls back to the public demo login.
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }} # upload the report even when tests fail
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
